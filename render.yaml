services:
  - type: web
    name: dk-electric-help
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_ENV
        value: production
      - key: PROPOSAL_VALIDITY_DAYS
        value: "15"
      - key: COMPANY_NAME
        value: DK Electric Help
      - key: COMPANY_PHONE
        value: "(19) 99624-5413"
      - key: COMPANY_EMAIL
        value: Dkeletrichelp@gmail.com
      - key: COMPANY_CNPJ
        value: "62.400.020/0001-07"
      - key: WHATSAPP_NOTIFY
        value: "5519996245413"
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_WHATSAPP_PHONE_ID
        sync: false
      - key: BASE_URL
        sync: false
