<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}DK Electric Help{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar">
  <div class="container nav-inner">
    <a href="/" class="nav-brand">
      <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="DK Electric Help" class="nav-logo-img">
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">Novo Orcamento</a>
      <a href="/orcamentos" class="nav-link">Orcamentos</a>
    </div>
  </div>
</nav>
<main class="container main-content">
  {% block content %}{% endblock %}
</main>
<footer class="footer">
  <div class="container footer-inner">
    <span>&copy; 2026 DK Electric Help - Engenharia Eletrica</span>
  </div>
</footer>
{% block extra_scripts %}{% endblock %}
</body>
</html>
